<div class="menu-page">
  <div class="menu-image-container">
    <div class="image-slider">
      <img [src]="menuImages[currentImageIndex]" alt="BREAKTIME Menu" class="menu-image">
    </div>

    <div class="slider-controls" aria-label="Ovládanie menu obrázkov">
      <button class="slider-btn" (click)="prevImage()" aria-label="Predchádzajúci obrázok">
        ‹
      </button>

      <div class="slider-indicators">
        <button
          *ngFor="let image of menuImages; let i = index"
          class="indicator"
          [class.active]="i === currentImageIndex"
          (click)="goToImage(i)"
          [attr.aria-label]="'Obrázok ' + (i + 1)">
        </button>
      </div>

      <button class="slider-btn" (click)="nextImage()" aria-label="Nasledujúci obrázok">
        ›
      </button>
    </div>
  </div>
</div>
